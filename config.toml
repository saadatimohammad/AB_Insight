
# A/B Insight - User Configuration

[input]
# Path to the experiment data file (CSV or XLSX)
file_path = "data/datasets/sample_experiment.csv"

[experiment]
# Options: "control" or "all_pairs"
comparison_mode = "control"

# Statistical significance level (0 < alpha < 1)
alpha = 0.05

[output]
language = "fa"

# Display statistical results in the console
console = true

# Save statistical results to an Excel workbook
excel = true

# Destination of the Excel report
output_path = "data/output/results.xlsx"
